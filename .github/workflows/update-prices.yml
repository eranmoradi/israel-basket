name: Daily Price Update

on:
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC = 10:00-11:00 Israel time
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  update-prices:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch chain prices
        run: python3 -u scripts/fetch_chain_prices.py

      - name: Commit updated prices
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add israel-basket/src/data/chain_prices.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update chain prices [$(date -u '+%Y-%m-%d')]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN does not fire deploy.yml's push trigger,
      # so the site must be redeployed explicitly after a price change.
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
